# =============================================================================
# file.conf - Fichier de configuration d'exemple
# Utilisé dans le cours « Variable spéciale $_ » :
#   $ ls -l file.conf
#   $ cp $_ /tmp
# =============================================================================

[general]
app_name    = demo-app
environment = production
log_level   = info
log_file    = /var/log/demo-app/app.log

[server]
host            = 0.0.0.0
port            = 8080
workers         = 4
timeout_seconds = 30

[database]
host     = db.internal.example.com
port     = 5432
name     = demo
user     = demo_user
pool_min = 2
pool_max = 10

[cache]
enabled     = true
backend     = redis
host        = cache.internal.example.com
port        = 6379
ttl_seconds = 300

[backup]
enabled     = true
schedule    = "0 2 * * *"
destination = /var/backups/demo-app
retention   = 7
# Fin fichier.
